name: google-utilities

permissions:
  contents: read

on:
  pull_request:
  schedule:
    # Run every day at 11pm (PST) - cron uses UTC times
    - cron:  '0 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changed_today:
    runs-on: ubuntu-latest
    name: Check if the repo was updated today
    outputs:
      WAS_CHANGED: ${{ steps.check_changed.outputs.WAS_CHANGED }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - id: check_changed
        name: Check
        if: ${{ github.event_name == 'schedule' }}
        run: echo '::set-output name=WAS_CHANGED::'$(test -n "$(git log --format=%H --since='24 hours ago')" && echo 'true' || echo 'false')

  pod-lib-lint:
    needs: changed_today
    if: ${{ github.event_name == 'pull_request' || needs.changed_today.outputs.WAS_CHANGED == 'true' }}

    runs-on: macOS-latest
    strategy:
      matrix:
        target: [ios, tvos, macos]
    steps:
    - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314
      with:
        ruby-version: "2.7"
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - name: Setup Scripts Directory
      run: ./setup-scripts.sh
    - name: Setup Bundler
      run: scripts/setup_bundler.sh
    - name: Build and test
      run: |
        scripts/third_party/travis/retry.sh scripts/pod_lib_lint.rb GoogleUtilities.podspec \
          --platforms=${{ matrix.target }} --analyze

  catalyst:
    needs: changed_today
    if: ${{ github.event_name == 'pull_request' || needs.changed_today.outputs.WAS_CHANGED == 'true' }}

    runs-on: macOS-latest
    steps:
    - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314
      with:
        ruby-version: "3.4"
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - name: Setup Scripts Directory
      run: ./setup-scripts.sh
    - name: Setup Bundler
      run: scripts/setup_bundler.sh
    - name: Setup project and Build for Catalyst
      run: |
        scripts/third_party/travis/retry.sh scripts/test_catalyst.sh GoogleUtilities test \
          GoogleUtilities-Unit-unit

  spm:
    needs: changed_today
    if: ${{ github.event_name == 'pull_request' || needs.changed_today.outputs.WAS_CHANGED == 'true' }}

    runs-on: macos-26
    strategy:
      matrix:
        target: [iOS, tvOS, macOS, catalyst]
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - name: Setup Scripts Directory
      run: ./setup-scripts.sh
    - name: Initialize xcodebuild
      run: |
        sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
        xcodebuild -list
    - name: Install simulators in case they are missing.
      if: matrix.target == 'iOS'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 15
        max_attempts: 5
        retry_wait_seconds: 120
        continue_on_error: true
        command: xcodebuild -downloadPlatform ${{ matrix.target }}
    - name: iOS Unit Tests
      run: scripts/third_party/travis/retry.sh scripts/build.sh GoogleUtilities-Package ${{ matrix.target }} spm

  utilities-cocoapods-option-matrix:
    needs: pod-lib-lint
    runs-on: macos-latest
    strategy:
      matrix:
        target: [ios, tvos, macos]
        flags: [
          '--use-static-frameworks',
          '--use-libraries --skip-tests'
        ]
    steps:
    - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314
      with:
        ruby-version: "2.7"
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - name: Setup Scripts Directory
      run: ./setup-scripts.sh
    - name: Setup Bundler
      run: scripts/setup_bundler.sh
    - name: PodLibLint GoogleUtilities Cron
      run: |
        scripts/third_party/travis/retry.sh scripts/pod_lib_lint.rb \
          GoogleUtilities.podspec --platforms=${{ matrix.target }} ${{ matrix.flags }} --analyze

  oss-exit-gate-release:
    name: Publish GitHub Release via OSS Exit Gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Stage release artifacts and upload manifest to OSS Exit Gate
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          ARCHIVE="googleutilities-${VERSION}.tar.gz"
          git archive --format=tar.gz -o "$ARCHIVE" HEAD
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=googleutilities--githubreleases \
            --package=googleutilities \
            --version="$VERSION" \
            --source="$ARCHIVE"
          printf '{"package":"googleutilities","version":"%s"}\n' "$VERSION" > manifest.json
          gcloud storage cp manifest.json "gs://oss-exit-gate-prod-googleutilities--githubreleases-manifests/googleutilities/${VERSION}/manifest.json"
